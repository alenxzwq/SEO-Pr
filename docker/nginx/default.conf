# ===== nginx перед «Подземкой» =====

upstream django {
    server web:8000;
}

# Если Django сам не прислал Cache-Control — HTML не кэшируем без проверки
map $upstream_http_cache_control $html_cache_control {
    ""      "no-cache";
    default $upstream_http_cache_control;
}

# Статика с хэшем в имени (style.3f2a1c9b0d4e.css) — неизменна, кэш на год.
# Без хэша — на час.
map $uri $static_cache_control {
    "~\.[0-9a-f]{12}\.[a-z0-9]+$"  "public, max-age=31536000, immutable";
    default                        "public, max-age=3600";
}

# --- Главное зеркало: www.что-угодно -> без www, один 301 ---
server {
    listen 80;
    server_name ~^www\.(?<main_host>.+)$;
    return 301 $scheme://$main_host$request_uri;
}

# --- Основной сервер ---
server {
    listen 80 default_server;
    server_name _;

    # Сжатие. text/html сжимается всегда, остальные типы перечисляем.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/xml application/javascript
               application/json application/ld+json image/svg+xml
               application/manifest+json;

    # Статика: nginx отдаёт сам, Django не трогаем
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        add_header Cache-Control $static_cache_control;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Метрики только для Prometheus внутри Docker-сети, снаружи — «нет такой страницы»
    location = /metrics {
        return 404;
    }

    # Всё остальное — в Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_hide_header Cache-Control;
        add_header Cache-Control $html_cache_control;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Своя страница, когда Django недоступен
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
        add_header Retry-After 120 always;
    }
}