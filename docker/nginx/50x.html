<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Поезд задерживается — Подземка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f0f0f;
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 520px;
            text-align: center;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 48px 32px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 16px;
            color: #ffb454;
            font-weight: 800;
            letter-spacing: -1px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #b8b8b8;
            margin-bottom: 24px;
        }
        .emoji {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
        }
        a {
            display: inline-block;
            color: #ffb454;
            text-decoration: none;
            border: 1px solid #ffb454;
            padding: 12px 24px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        a:hover {
            background: #ffb454;
            color: #0f0f0f;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="emoji">🚇</span>
        <h1>Поезд задерживается</h1>
        <p>Сайт «Подземки» временно недоступен — мы уже работаем над этим. Попробуйте обновить страницу через пару минут.</p>
        <a href="/">Вернуться на главную</a>
    </div>
</body>
</html>
